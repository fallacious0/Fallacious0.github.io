<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everystream - Live Match Center</title>
    
    <!-- API-Sports Widget Script Component -->
    <script type="module" src="https://widgets.api-sports.io/3.0.0/widgets.js"></script>

    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --accent-color: #3b82f6;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .logo {
            font-size: 1.25rem;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: var(--text-color);
        }

        .logo span {
            color: var(--accent-color);
        }

        main {
            flex: 1;
            max-width: 1200px;
            width: 100%;
            margin: 2rem auto;
            padding: 0 1rem;
            display: grid;
            gap: 2rem;
        }

        .match-section {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            overflow: hidden;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .section-header {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            font-size: 1rem;
            font-weight: 600;
        }

        .widget-wrapper {
            padding: 1rem;
            min-height: 500px;
        }

        footer {
            text-align: center;
            padding: 1.5rem;
            font-size: 0.875rem;
            color: #94a3b8;
            border-top: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <!-- Global API-Sports Configuration Setup -->
    <!-- Replace YOUR_API_KEY with your live key from dashboard.api-sports.io -->
    <api-sports-widget 
        data-type="config" 
        data-key="YOUR_API_KEY" 
        data-sport="football" 
        data-theme="dark" 
        data-lang="en"
        data-refresh="15">
    </api-sports-widget>

    <header>
        <div class="logo">Every<span>stream</span></div>
    </header>

    <main>
        <!-- Main Match Center / Player Module -->
        <section class="match-section">
            <div class="section-header">Live Match Center</div>
            <div class="widget-wrapper">
                <!-- API-Sports Game Widget Component (Change data-game-id for different matches) -->
                <api-sports-widget 
                    data-type="game" 
                    data-game-id="1035012" 
                    data-game-tab="events">
                </api-sports-widget>
            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 Everystream. Powered by API-Sports.</p>
    </footer>

</body>
</html>
