<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Sports Scores</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            padding: 20px;
        }
        .match-card {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 12px 16px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            max-width: 500px;
        }
        .team-names {
            font-weight: bold;
        }
        .match-score {
            background-color: #ff3b30;
            color: #fff;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.9em;
        }
        .match-time {
            font-size: 0.85em;
            color: #aaa;
        }
    </style>
</head>
<body>

    <h2>⚽ Live Matches</h2>
    <div id="scores-container">Loading live matches...</div>

    <script>
        const API_KEY = "7a2315dd7c36efaeb1f7fb7b46c5e442";

        async function loadLiveScores() {
            const container = document.getElementById('scores-container');
            
            try {
                const response = await fetch("https://v3.football.api-sports.io/fixtures?live=all", {
                    method: "GET",
                    headers: {
                        "x-apisports-key": API_KEY
                    }
                });

                if (!response.ok) throw new Error("API request failed");

                const data = await response.json();
                const matches = data.response;

                if (!matches || matches.length === 0) {
                    container.innerHTML = "<p>No live matches currently playing.</p>";
                    return;
                }

                // Build match cards dynamically
                container.innerHTML = matches.map(item => {
                    const home = item.teams.home.name;
                    const away = item.teams.away.name;
                    const homeScore = item.goals.home ?? 0;
                    const awayScore = item.goals.away ?? 0;
                    const minute = item.fixture.status.elapsed;
                    const league = item.league.name;

                    return `
                        <div class="match-card">
                            <div>
                                <div style="font-size: 0.75em; color: #888;">${league}</div>
                                <div class="team-names">${home} vs ${away}</div>
                            </div>
                            <div style="text-align: right;">
                                <span class="match-score">${homeScore} - ${awayScore}</span>
                                <div class="match-time">${minute}'</div>
                            </div>
                        </div>
                    `;
                }).join('');

            } catch (error) {
                container.innerHTML = "<p>Failed to load live scores.</p>";
                console.error(error);
            }
        }

        // Initial load
        loadLiveScores();

        // Refresh live score data every 60 seconds
        setInterval(loadLiveScores, 60000);
    </script>
</body>
</html>
