<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Everystream | Live Sports</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0c;
            --bg-panel: #16161a;
            --bg-hover: #222228;
            --accent: #e2ff00; /* Sleek neon yellow/green accent */
            --text-main: #ffffff;
            --text-muted: #888891;
            --live-red: #ff3333;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-base);
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden; /* App-like feel */
        }

        /* --- Navbar --- */
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 40px;
            background-color: var(--bg-base);
            border-bottom: 1px solid #1f1f25;
        }

        .logo {
            font-size: 24px;
            font-weight: 800;
            letter-spacing: -1px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .logo span { color: var(--accent); }

        .sport-filters {
            display: flex;
            gap: 12px;
        }

        .sport-btn {
            background-color: var(--bg-panel);
            color: var(--text-muted);
            border: 1px solid transparent;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sport-btn:hover { background-color: var(--bg-hover); color: var(--text-main); }
        .sport-btn.active { background-color: var(--accent); color: #000; }

        /* --- Main Layout --- */
        .app-container {
            display: flex;
            flex: 1;
            overflow: hidden;
        }

        /* --- Video Player Area --- */
        .player-section {
            flex: 3;
            padding: 30px 40px;
            display: flex;
            flex-direction: column;
            overflow-y: auto;
        }

        .video-wrapper {
            width: 100%;
            padding-bottom: 56.25%; /* 16:9 */
            position: relative;
            background-color: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .video-wrapper iframe {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            border: none;
        }

        .stream-title {
            margin-top: 20px;
            font-size: 22px;
            font-weight: 600;
        }

        /* --- Live Scores Sidebar --- */
        .sidebar {
            flex: 1;
            min-width: 350px;
            max-width: 450px;
            background-color: var(--bg-panel);
            border-left: 1px solid #1f1f25;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 20px;
            font-size: 16px;
            font-weight: 600;
            border-bottom: 1px solid #1f1f25;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            color: var(--live-red);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--live-red);
            border-radius: 50%;
            animation: pulse-anim 1.5s infinite;
        }

        @keyframes pulse-anim {
            0% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0.7); }
            70% { box-shadow: 0 0 0 6px rgba(255, 51, 51, 0); }
            100% { box-shadow: 0 0 0 0 rgba(255, 51, 51, 0); }
        }

        .scores-list {
            flex: 1;
            overflow-y: auto;
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* --- Score Cards --- */
        .score-card {
            background-color: var(--bg-base);
            border-radius: 10px;
            padding: 16px;
            transition: transform 0.2s;
            cursor: pointer;
            border: 1px solid #1f1f25;
        }

        .score-card:hover { border-color: var(--accent); }

        .match-meta {
            font-size: 11px;
            color: var(--text-muted);
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .team-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 8px;
        }
        
        .team-row:last-child { margin-bottom: 0; }

        .team-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .team-logo { width: 24px; height: 24px; object-fit: contain; }
        .team-name { font-size: 15px; font-weight: 600; }
        .team-score { font-size: 16px; font-weight: 800; }

        .loading-text { color: var(--text-muted); text-align: center; margin-top: 40px; font-size: 14px; }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container { flex-direction: column; overflow-y: auto; }
            .sidebar { min-width: 100%; border-left: none; border-top: 1px solid #1f1f25; }
            .player-section { padding: 15px; }
            header { padding: 15px; flex-direction: column; gap: 15px; }
        }
    </style>
</head>
<body>

    <header>
        <div class="logo">
            <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 3v18"/><path d="M19 3v18"/><path d="M5 12h14"/></svg>
            Every<span>stream</span>
        </div>
        <div class="sport-filters" id="sport-filters">
            <button class="sport-btn active" data-sport="football">Football</button>
            <button class="sport-btn" data-sport="nba">NBA</button>
            <button class="sport-btn" data-sport="nfl">NFL</button>
            <button class="sport-btn" data-sport="hockey">Hockey</button>
        </div>
    </header>

    <div class="app-container">
        <!-- Main Player -->
        <main class="player-section">
            <div class="video-wrapper">
                <!-- Replace with your Twitch/YouTube parent domain -->
                <iframe src="https://player.twitch.tv/?channel=twitchsports&parent=localhost&muted=true" allowfullscreen></iframe>
            </div>
            <h1 class="stream-title">Main Event Broadcast</h1>
        </main>

        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span>Live Action</span>
                <div class="live-indicator"><div class="pulse"></div> LIVE</div>
            </div>
            <div class="scores-list" id="scores-container">
                <div class="loading-text">Fetching live data...</div>
            </div>
        </aside>
    </div>

    <script>
// ESPN Public Endpoints
const SPORT_ENDPOINTS = {
    football: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard",
    nba: "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",
    nfl: "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
    hockey: "https://site.api.espn.com/apis/site/v2/sports/hockey/nhl/scoreboard"
};

// Default featured Twitch channels per sport
const DEFAULT_STREAMS = {
    football: "easportsfc",
    nba: "nba",
    nfl: "nfl",
    hockey: "nhl"
};

let currentSport = 'football';

// 1. Auto-detect current domain to satisfy Twitch security rules
function getTwitchParentDomain() {
    const host = window.location.hostname;
    // If opening as local file (file://), default to localhost
    return host === "" ? "localhost" : host;
}

// 2. Load stream into iframe dynamically
function loadStream(channelName, matchTitle) {
    const parentDomain = getTwitchParentDomain();
    const iframe = document.querySelector('.video-wrapper iframe');
    const titleElement = document.querySelector('.stream-title');

    if (iframe) {
        iframe.src = `https://player.twitch.tv/?channel=${channelName}&parent=${parentDomain}&muted=true`;
    }

    if (titleElement && matchTitle) {
        titleElement.textContent = `Live: ${matchTitle}`;
    }
}

// 3. Fetch and render live scores with click handlers
async function fetchLiveScores(sport) {
    const container = document.getElementById('scores-container');
    container.innerHTML = '<div class="loading-text">Loading matches...</div>';
    
    try {
        const response = await fetch(SPORT_ENDPOINTS[sport]);
        if (!response.ok) throw new Error("Network error");
        
        const data = await response.json();
        const matches = data.events;

        if (!matches || matches.length === 0) {
            container.innerHTML = `<div class="loading-text">No ${sport.toUpperCase()} matches scheduled for today.</div>`;
            return;
        }

        container.innerHTML = matches.map((event, index) => {
            const comp = event.competitions[0];
            const homeTeam = comp.competitors.find(c => c.homeAway === 'home');
            const awayTeam = comp.competitors.find(c => c.homeAway === 'away');
            
            const status = event.status.type;
            const isLive = status.state === 'in';
            const timeColor = isLive ? 'var(--live-red)' : 'var(--text-muted)';
            const matchTitle = `${homeTeam.team.shortDisplayName} vs ${awayTeam.team.shortDisplayName}`;
            
            return `
                <div class="score-card ${index === 0 ? 'active-card' : ''}" 
                     onclick="selectMatch('${matchTitle}', '${DEFAULT_STREAMS[sport]}', this)">
                    <div class="match-meta">
                        <span>${data.leagues[0]?.abbreviation || sport.toUpperCase()}</span>
                        <span style="color: ${timeColor}; font-weight: bold;">${status.detail}</span>
                    </div>
                    <div class="team-row">
                        <div class="team-info">
                            <img src="${homeTeam.team.logo || ''}" class="team-logo" alt="logo" onerror="this.style.display='none'">
                            <span class="team-name">${homeTeam.team.shortDisplayName}</span>
                        </div>
                        <span class="team-score">${homeTeam.score !== "0" || status.state !== 'pre' ? homeTeam.score : '-'}</span>
                    </div>
                    <div class="team-row">
                        <div class="team-info">
                            <img src="${awayTeam.team.logo || ''}" class="team-logo" alt="logo" onerror="this.style.display='none'">
                            <span class="team-name">${awayTeam.team.shortDisplayName}</span>
                        </div>
                        <span class="team-score">${awayTeam.score !== "0" || status.state !== 'pre' ? awayTeam.score : '-'}</span>
                    </div>
                </div>
            `;
        }).join('');

        // Automatically set player title to the first match in list
        if (matches[0]) {
            const firstComp = matches[0].competitions[0];
            const home = firstComp.competitors.find(c => c.homeAway === 'home').team.shortDisplayName;
            const away = firstComp.competitors.find(c => c.homeAway === 'away').team.shortDisplayName;
            loadStream(DEFAULT_STREAMS[sport], `${home} vs ${away}`);
        }

    } catch (error) {
        container.innerHTML = '<div class="loading-text">Failed to fetch scores.</div>';
        console.error(error);
    }
}

// 4. Handle score card selection
function selectMatch(matchTitle, channel, cardElement) {
    // Highlight active card
    document.querySelectorAll('.score-card').forEach(card => {
        card.style.borderColor = '#1f1f25';
    });
    cardElement.style.borderColor = 'var(--accent)';

    // Update stream player
    loadStream(channel, matchTitle);
}

// 5. Handle sport tab switching
document.querySelectorAll('.sport-btn').forEach(btn => {
    btn.addEventListener('click', (e) => {
        document.querySelectorAll('.sport-btn').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        currentSport = e.target.dataset.sport;
        fetchLiveScores(currentSport);
    });
});

// Initial load
fetchLiveScores(currentSport);

// Auto refresh scores every 60 seconds
setInterval(() => fetchLiveScores(currentSport), 60000);
    </script>
</body>
</html>
